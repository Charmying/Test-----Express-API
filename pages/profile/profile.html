<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>個人資料</title>
  <link rel="stylesheet" href="../../css/reset.css">
  <link rel="stylesheet" href="../../css/style.css">
  </script>
</head>
<body>
  <section>
    <h1>個人資料</h1>
    <div class="my-8"> 
      <div id="userInfo">
        <div class="flex justify-center my-2">
          <p style="width: 125px;">帳號:</p>
          <p style="width: 200px;" id="account"></p>
        </div>
        <div class="flex justify-center my-2">
          <p style="width: 125px;">電子郵件:</p>
          <p style="width: 200px;" id="email"></p>
        </div>
        <div class="flex justify-center my-2">
          <p style="width: 125px;">使用者名稱:</p>
          <p style="width: 200px;" id="userName"></p>
        </div>
        <div class="flex justify-center my-2">
          <p style="width: 125px;">手機號碼:</p>
          <p style="width: 200px;" id="phone"></p>
        </div>
        <div class="flex justify-center my-2">
          <p style="width: 125px;">地址:</p>
          <p style="width: 200px;" id="address"></p>
        </div>
        <div class="flex justify-center my-2">
          <p style="width: 125px;">個人簡介:</p>
          <p style="width: 200px;" id="bio"></p>
        </div>
      </div>
      <div class="flex justify-center my-8">
        <button id="editButton">編輯資料</button>
      </div>
      <div class="my-8">
        <form id="editForm" style="display: none;">
          <div class="flex justify-center my-2">
            <label for="userName">使用者名稱:</label>
            <input type="text" id="editUserName">
          </div>
          <div class="flex justify-center my-2">
            <label for="phone">手機號碼:</label>
            <input type="text" id="editPhone">
          </div>
          <div class="flex justify-center my-2">
            <label for="address">地址:</label>
            <input type="text" id="editAddress">
          </div>
          <div class="flex justify-center my-2">
            <label for="bio">個人簡介:</label>
            <textarea id="editBio"></textarea>
          </div>
          <div class="flex justify-center my-8">
            <button type="submit">儲存變更</button>
          </div>
        </form>
        <div class="text-center my-8" id="message"></div>
      </div>
    </div>
  </section>

  <script src="./profile.js"></script>
</body>
</html>
